name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  windows-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Session machine smoke
        run: npm run smoke:session-machine

      - name: VNext regression smoke
        run: npm run smoke:vnext-regression
